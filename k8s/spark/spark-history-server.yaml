apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: spark-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      serviceAccountName: spark-history-sa
      containers:
        - name: spark-history-server
          image: apache/spark:v3.5.0
          command: ["/opt/spark/sbin/start-history-server.sh"]
          env:
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=s3a://spark-event-logs/
                -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
                -Dspark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.DefaultAWSCredentialsProviderChain
          ports:
            - containerPort: 18080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: spark-history
spec:
  type: ClusterIP
  ports:
    - port: 18080
      targetPort: 18080
      name: http
  selector:
    app: spark-history-server