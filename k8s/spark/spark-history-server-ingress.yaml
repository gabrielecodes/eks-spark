apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark-history-server-ingress
  namespace: spark-history
  annotations:
    ingressClassName: alb
    alb.ingress.kubernetes.io/group.name: observability-tools
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/your-acm-cert-id
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  rules:
    - host: spark-history.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spark-history-server
                port:
                  number: 18080