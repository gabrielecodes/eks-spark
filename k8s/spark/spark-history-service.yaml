apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-history-config
  namespace: spark-history
  labels:
    app.kubernetes.io/name: spark-history-server
    name: spark-history-server
data:
  spark-defaults.conf: |
    # Storage directory where event logs are written by Spark drivers
    spark.history.fs.logDirectory                 s3a://spark-event-logs-demo
    spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.aws.credentials.provider  software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider
    spark.hadoop.fs.s3a.endpoint                  s3.amazonaws.com
    spark.hadoop.fs.s3a.impl.disable.cache        true
    spark.hadoop.fs.s3a.path.style.access         true

    # History Server Web UI  Port
    spark.history.ui.port    18080

    # Automatic log cleanup configuration
    spark.history.fs.cleaner.enabled   true
    spark.history.fs.cleaner.interval  1d
    spark.history.fs.cleaner.maxAge    30d

    # Performance tuning for Spark 4.x
    spark.history.retainedApplications 100
    spark.history.fs.numReplayThreads  8

    # Jars
    spark.jars.packages org.apache.hadoop:hadoop-aws:3.5.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: spark-history
  labels:
    app.kubernetes.io/name: spark-history-server
    name: spark-history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-history-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-history-server
  spec:
    initContainers:
      - name: init-spark-history-server
        image: "maven:3.9-eclipse-temurin-17"
        command:
          - sh
          - "-c"
          - |
            mvn dependency:get \
              -Dartifact=org.apache.hadoop:hadoop-aws:3.5.0 \
              -Dtransitive=true
            cp ~/.m2/repository/org/apache/hadoop/hadoop-aws/3.5.0/*.jar /extra-jars/
            find ~/.m2/repository/software/amazon/awssdk -name "*.jar" -exec cp {} /extra-jars/ \;
        volumeMounts:
          - name: extra-jars
            mountPath: /extra-jars
    containers:
      - name: spark-history-server
        image: apache/spark:4.1.0
        command:
          - /opt/spark/bin/spark-class
        args:
          - org.apache.spark.deploy.history.HistoryServer
        env:
          - name: SPARK_NO_DAEMONIZE
            value: "true"
          - name: SPARK_CONF_DIR
            value: "/opt/spark/conf"
          - name: SPARK_DIST_CLASSPATH
            value: "/opt/spark/jars/*:/opt/spark/extra-jars/*"
        ports:
          - name: http
            containerPort: 18080
            protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 18080
          initialDelaySeconds: 30
          periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /
        #     port: 18080
        #   initialDelaySeconds: 15
        #   periodSeconds: 10
        volumeMounts:
          - name: extra-jars
            mountPath: /opt/spark/extra-jars
          - name: spark-config
            mountPath: /opt/spark/conf/spark-defaults.conf
            subPath: spark-defaults.conf
    volumes:
      - name: extra-jars
        emptyDir: {}
      - name: spark-config
        configMap:
          name: spark-history-config
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: spark-history
spec:
  type: ClusterIP
  ports:
    - port: 18080
      targetPort: 18080
      name: http
  selector:
    app.kubernetes.io/name: spark-history-server
