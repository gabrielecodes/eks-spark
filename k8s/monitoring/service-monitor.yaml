apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spark-observability-demo
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - spark-jobs

  selector:
    matchLabels:
      monitoring: spark

  endpoints:
    - port: metrics
      path: /metrics/executors/prometheus
      interval: 15s
