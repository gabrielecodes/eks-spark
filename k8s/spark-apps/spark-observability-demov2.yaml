apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-observability-demo
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: 593807194470.dkr.ecr.eu-west-1.amazonaws.com/spark_images:latest
  imagePullPolicy: IfNotPresent
  sparkVersion: "4.1.0"
  mainApplicationFile: "s3a://spark-workflows-demo/observability.py"

  sparkConf:
    spark.jars.ivy: "/tmp/.ivy2"
    spark.jars.packages: "org.apache.hadoop:hadoop-aws:3.5.0"
    spark.hadoop.fs.s3a.fast.upload: "true"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"

    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "s3a://spark-event-logs-demo/"
    spark.kubernetes.driver.log.dfsDir: "s3a://spark-event-logs-demo/logs"
    spark.kubernetes.executor.log.dfsDir: "s3a://spark-event-logs-demo/logs"

    spark.ui.acls.enable: "true"

    spark.ui.prometheus.enabled: "true"
    spark.metrics.conf.*.sink.prometheusServlet.class: "org.apache.spark.metrics.sink.PrometheusServlet"
    spark.metrics.conf.*.sink.prometheusServlet.path: "/metrics/prometheus"
    spark.metrics.conf.*.source.jvm.class: "org.apache.spark.metrics.source.JvmSource"

  restartPolicy:
    type: Never

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      name: spark-observability-demo-driver
      version: 4.1.0
    serviceAccount: spark-pod
    ports:
      - name: spark-metrics
        containerPort: 4040

  executor:
    cores: 1
    instances: 2
    memory: "512m"
    serviceAccount: spark-pod
    labels:
      name: spark-observability-demo-executor
      version: 4.1.0
    ports:
      - name: spark-metrics
        containerPort: 4040
---
# Monitor to scrape the metrics from the Spark driver and executor pods
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: spark-pod-monitor
  namespace: spark-jobs
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      spark-app-name: spark-observability-demo

  podMetricsEndpoints:
    - port: spark-metrics
      path: /metrics/prometheus
      interval: 15s

  # propagate k8s pod labels to prometheus
  podTargetLabels:
    - spark-app-name
    - spark-role
