apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark-jobs
spec:
  type: Scala
  mode: cluster
  image: apache/spark:4.2.0
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.13-4.2.0.jar"
  sparkVersion: "4.2.0"
  sparkConf:
    spark.jars.ivy: "/tmp/.ivy2"
    spark.jars.packages: "org.apache.hadoop:hadoop-aws:3.5.0"
    spark.hadoop.fs.s3a.fast.upload: "true"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"

    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "s3a://spark-event-logs-demo/"
    spark.kubernetes.driver.log.dfsDir: "s3a://spark-event-logs-demo/logs"
    spark.kubernetes.executor.log.dfsDir: "s3a://spark-event-logs-demo/logs"

    spark.ui.acls.enable: "true"
    spark.ui.prometheus.enabled: "true"

  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 4.2.0
    serviceAccount: spark-pod
  executor:
    cores: 1
    instances: 2
    memory: "512m"
    serviceAccount: spark-pod
    labels:
      version: 4.2.0
