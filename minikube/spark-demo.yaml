apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-observability-demo
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: docker.io/library/spark_base:0.1.0
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/jobs/observability.py"

  monitoring:
    exposeDriverMetrics: true
    exposeExecutorMetrics: true

    prometheus:
      jmxExporterJar: "/opt/spark/jars/jmx_prometheus_javaagent.jar"
      port: 8090
      configuration: |
        rules:
          - pattern: "."

  sparkConf:
    spark.jars.ivy: "/tmp/.ivy2"
    spark.jars.packages: "org.apache.hadoop:hadoop-aws:3.5.0"
    spark.hadoop.fs.s3a.fast.upload: "true"

    spark.eventLog.enabled: "true"

    spark.ui.acls.enable: "true"
    spark.ui.prometheus.enabled: "true"

  restartPolicy:
    type: Never

  volumes:
    - name: spark-code
      configMap:
        name: observability

  driver:
    nodeSelector:
      main: "true"
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    volumeMounts:
      - name: spark-code
        mountPath: /opt/spark/jobs
    labels:
      name: spark-observability-demo
    serviceAccount: spark-pod

  executor:
    nodeSelector:
      main: "true"
    cores: 1
    instances: 2
    memory: "512m"
    volumeMounts:
      - name: spark-code
        mountPath: /opt/spark/jobs
    serviceAccount: spark-pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-pod
  namespace: spark-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-executor-runner-role
  namespace: spark-jobs
rules:
  # Manage executor pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      [
        "get",
        "list",
        "watch",
        "create",
        "delete",
        "deletecollection",
        "patch",
        "update",
      ]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  # Read pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-executor-runner-binding
  namespace: spark-jobs
subjects:
  - kind: ServiceAccount
    name: spark-pod
    namespace: spark-jobs
roleRef:
  kind: Role
  name: spark-executor-runner-role
  apiGroup: rbac.authorization.k8s.io

